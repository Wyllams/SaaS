name: Foundation CI

on:
  push:
    branches:
      - main
      - epic/00-foundation
      - migration/supabase-backend
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install committed dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify foundation structure
        run: pnpm run verify:structure

      - name: Verify secret baseline
        run: pnpm run verify:secrets

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Type-check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Verify Supabase runtime is versioned
        run: |
          test -f supabase/config.toml
          test -f supabase/functions/identity-me/index.ts
          test -f supabase/migrations/20260925230745_enable_supabase_async_infrastructure.sql

      - name: Verify repository remains clean
        run: |
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "$STATUS"
            exit 1
          fi
