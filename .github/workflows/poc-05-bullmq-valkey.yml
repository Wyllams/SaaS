name: POC-05 BullMQ Valkey

on:
  push:
    branches:
      - poc/05-bullmq-valkey
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      valkey:
        image: valkey/valkey:8.1.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      VALKEY_HOST: 127.0.0.1
      VALKEY_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify Valkey
        run: |
          docker exec $(docker ps -q --filter ancestor=valkey/valkey:8.1.10-alpine) valkey-cli INFO server | head -30

      - name: Type-check queue PoC
        run: pnpm --filter @crewcommand/queue-poc check

      - name: Run queue PoC
        run: pnpm --filter @crewcommand/queue-poc poc:test
