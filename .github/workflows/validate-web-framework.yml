name: Validate Web Framework Candidate

on:
  push:
    branches:
      - validation/web-nextjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install committed dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify approved monorepo structure
        run: pnpm run verify:structure

      - name: Type-check Web candidate
        run: pnpm --filter @crewcommand/web check

      - name: Build Web candidate
        run: pnpm --filter @crewcommand/web build
