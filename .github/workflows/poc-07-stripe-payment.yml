name: POC-07 Stripe Direct Payment Probe

on:
  push:
    branches:
      - poc/07-stripe-connect
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRIPE_API_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      CONNECTED_ACCOUNT_ID: acct_1UJPZzCadkRjd2jY

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Stripe CLI 1.52.0
        run: |
          curl -fsSL -o /tmp/stripe.tar.gz https://github.com/stripe/stripe-cli/releases/download/v1.52.0/stripe_1.52.0_linux_x86_64.tar.gz
          tar -xzf /tmp/stripe.tar.gz -C /tmp
          sudo install /tmp/stripe /usr/local/bin/stripe
          stripe version

      - name: Create direct test payment twice with same idempotency key
        id: payment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .poc

          create_payment() {
            stripe payment_intents create               --stripe-account "$CONNECTED_ACCOUNT_ID"               --idempotency="crewcommand-poc07-direct-payment-probe-v1"               -d amount=1250               -d currency=usd               -d payment_method=pm_card_visa               -d confirm=true               -d "payment_method_types[]=card"               -d "metadata[workspace_id]=poc07_workspace"               -d "metadata[invoice_id]=poc07_invoice"
          }

          create_payment > .poc/payment-1.json
          create_payment > .poc/payment-2.json

          PI1="$(jq -r '.id' .poc/payment-1.json)"
          PI2="$(jq -r '.id' .poc/payment-2.json)"
          test "$PI1" = "$PI2"
          test "$(jq -r '.status' .poc/payment-1.json)" = "succeeded"
          test "$(jq -r '.livemode' .poc/payment-1.json)" = "false"

          echo "payment_intent_id=$PI1" >> "$GITHUB_OUTPUT"

          jq '{
            id,
            amount,
            currency,
            status,
            livemode,
            workspace_id: .metadata.workspace_id,
            invoice_id: .metadata.invoice_id,
            idempotency_same_object: true
          }' .poc/payment-1.json > .poc/payment-sanitized.json
          cat .poc/payment-sanitized.json

      - name: Retrieve authoritative PaymentIntent
        shell: bash
        env:
          PAYMENT_INTENT_ID: ${{ steps.payment.outputs.payment_intent_id }}
        run: |
          stripe payment_intents retrieve "$PAYMENT_INTENT_ID"             --stripe-account "$CONNECTED_ACCOUNT_ID"             > .poc/retrieved.json

          test "$(jq -r '.id' .poc/retrieved.json)" = "$PAYMENT_INTENT_ID"
          test "$(jq -r '.status' .poc/retrieved.json)" = "succeeded"

          jq '{id,status,amount,currency,livemode}' .poc/retrieved.json > .poc/retrieved-sanitized.json
          cat .poc/retrieved-sanitized.json

      - name: Confirm provider event
        shell: bash
        env:
          PAYMENT_INTENT_ID: ${{ steps.payment.outputs.payment_intent_id }}
        run: |
          stripe events list             --stripe-account "$CONNECTED_ACCOUNT_ID"             --type=payment_intent.succeeded             --limit=20             > .poc/events.json

          MATCHES="$(jq --arg pi "$PAYMENT_INTENT_ID" '[.data[] | select(.data.object.id == $pi)] | length' .poc/events.json)"
          test "$MATCHES" -ge 1
          printf '{"provider_event":"PASS","matching_events":%s}\n' "$MATCHES" > .poc/event-sanitized.json
          cat .poc/event-sanitized.json

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: poc-07-stripe-direct-payment-evidence
          path: |
            .poc/payment-sanitized.json
            .poc/retrieved-sanitized.json
            .poc/event-sanitized.json
          if-no-files-found: error
