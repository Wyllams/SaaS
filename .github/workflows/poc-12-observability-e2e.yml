name: POC-12 Observability E2E

on:
  push:
    branches:
      - poc/12-observability-e2e
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install committed dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify monorepo structure
        run: pnpm run verify:structure

      - name: Build observability contract
        run: pnpm --filter observability-poc build

      - name: Run end-to-end observability tests
        run: pnpm --filter observability-poc check
