name: POC-11 Expo Mobile

on:
  push:
    branches:
      - poc/11-expo-mobile
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install committed dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify monorepo structure
        run: pnpm run verify:structure

      - name: Verify Expo SDK dependency alignment
        working-directory: apps/mobile
        run: pnpm exec expo install --check

      - name: Type-check and contract tests
        working-directory: apps/mobile
        run: pnpm run check

      - name: Preserve monorepo build artifact contract
        working-directory: apps/mobile
        run: pnpm run build

      - name: Export Android bundle
        working-directory: apps/mobile
        run: pnpm run poc:bundle:android

      - name: Export iOS bundle
        working-directory: apps/mobile
        run: pnpm run poc:bundle:ios

      - name: Upload bundle evidence
        uses: actions/upload-artifact@v7
        with:
          name: poc-11-expo-bundle-evidence
          path: |
            apps/mobile/.poc/android-bundle
            apps/mobile/.poc/ios-bundle
          if-no-files-found: error
