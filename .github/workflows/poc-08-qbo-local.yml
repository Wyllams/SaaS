name: POC-08 QuickBooks Local Contract

on:
  push:
    branches:
      - poc/08-quickbooks-online
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Type-check and test QBO contract
        run: pnpm --filter @crewcommand/qbo-poc check
