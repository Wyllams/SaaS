name: POC-12 Sentry External Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentry-external:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install committed dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify local observability contract
        run: |
          pnpm run verify:structure
          pnpm --filter observability-poc build
          pnpm --filter observability-poc check

      - name: Send controlled error and trace to Sentry
        run: pnpm --filter observability-poc external
