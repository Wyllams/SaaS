name: POC-07 Stripe Connect Local Contract

on:
  push:
    branches:
      - poc/07-stripe-connect
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install dependencies and update lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Persist dependency lockfile once
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml pnpm-workspace.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml pnpm-workspace.yaml
            git commit -m "chore: persist POC-07 dependency lockfile"
            git push
          fi

      - name: Type-check and test Stripe contract
        run: pnpm --filter @crewcommand/stripe-poc check
