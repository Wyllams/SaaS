name: Epic 0 Foundation Bootstrap

on:
  push:
    branches:
      - epic/00-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: epic/00-foundation

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Resolve dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Ensure manifests were not mutated
        run: git diff --exit-code -- package.json pnpm-workspace.yaml apps/*/package.json packages/*/package.json

      - name: Verify foundation structure
        run: pnpm run verify:structure

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Commit resolved lockfile
        run: |
          if [ -z "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            echo "Lockfile already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(epic-00): lock foundation dependencies [skip ci]"
          git push origin HEAD:epic/00-foundation
